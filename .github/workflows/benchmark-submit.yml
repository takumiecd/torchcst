name: Submit benchmark observation

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Retry a benchmark result issue (original issue author remains the submitter)
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: benchmark-submission-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.repository == 'takumiecd/torchcst' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (startsWith(github.event.issue.title, '[Benchmark result] ') &&
        github.event.sender.id == github.event.issue.user.id))
    runs-on: ubuntu-latest
    environment: benchmark-database
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install central CPU validation tooling
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Fetch and validate attached JSON without database credentials
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: >-
          python -m benchmarks.submissions fetch
          --issue-number "$ISSUE_NUMBER" --output output/submission
      - name: Append observation and enforce account quota atomically
        env:
          PYTHONPATH: src
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: >-
          python -m benchmarks.submissions ingest
          --input output/submission --receipt output/submission-receipt.json
      - name: Reply to submission issue
        if: always()
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          INTAKE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python -m benchmarks.submissions feedback
          --issue-number "$ISSUE_NUMBER" --receipt output/submission-receipt.json
          --run-url "$INTAKE_RUN_URL"
