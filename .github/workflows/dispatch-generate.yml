name: Generate dispatch artifact

on:
  workflow_dispatch:
    inputs:
      request_file:
        description: Committed generation request JSON (dataset filters, score policy, fallback)
        type: string
        required: true

permissions:
  contents: read

jobs:
  generate:
    if: github.repository == 'takumiecd/torchcst' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: benchmark-database
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install CPU generation tooling
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Rank a fixed read-only database snapshot
        env:
          PYTHONPATH: src
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REQUEST_FILE: ${{ inputs.request_file }}
        run: >-
          python -m benchmarks.dispatch
          --request "$REQUEST_FILE" --output output/generated-dispatch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dispatch-candidate
          path: output/generated-dispatch
          if-no-files-found: error
          retention-days: 14
