name: Import benchmark contribution

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Public fork that ran Benchmark measurement (owner/repository)
        required: true
        type: string
      run_id:
        description: Completed measurement Actions run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  ingest:
    if: github.repository == 'takumiecd/torchcst' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: benchmark-database
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install central validation tooling
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Fetch and validate contribution before receiving DB credentials
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_ARTIFACT_READ_TOKEN || github.token }}
          PYTHONPATH: src
          SUBMISSION_REPOSITORY: ${{ inputs.repository }}
          SUBMISSION_RUN_ID: ${{ inputs.run_id }}
        run: >-
          python -m benchmarks.automation.contributions fetch
          --repository "$SUBMISSION_REPOSITORY" --run-id "$SUBMISSION_RUN_ID"
          --output output/contribution
      - name: Append verified observations to Neon
        env:
          PYTHONPATH: src
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: >-
          python -m benchmarks.automation ingest
          --request output/contribution/request/request.json
          --results output/contribution/measurement/results
          --provenance output/contribution/provenance.json
