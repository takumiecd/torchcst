name: Benchmark measurement

on:
  workflow_dispatch:
    inputs:
      request_file:
        description: Committed measurement JSON (cases, GPUs, repetitions)
        type: string
        required: true
        default: benchmarks/requests/colab-linear.json

permissions:
  contents: read

concurrency:
  group: benchmark-colab
  cancel-in-progress: false

jobs:
  prepare:
    # Fork users measure the unchanged upstream commit on their default branch.
    # A protected validation environment can test a reviewed feature ref.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == vars.BENCHMARK_VALIDATION_REF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install CPU tooling
        run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Freeze measurement request
        env:
          PYTHONPATH: src
          REQUEST_FILE: ${{ inputs.request_file }}
        run: >-
          python -m benchmarks.automation prepare
          --request "$REQUEST_FILE"
          --output output/request.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-request
          path: output/request.json
          if-no-files-found: error
          retention-days: 14

  measure:
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'benchmark-colab' || 'benchmark-colab-validation' }}
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: benchmark-request
          path: output/official-request
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned Colab client
        run: python -m pip install google-colab-cli==0.6.0
      - name: Restore and verify Colab authentication
        env:
          COLAB_AUTH_JSON: ${{ secrets.COLAB_AUTH_JSON }}
          COLAB_ACCOUNT: ${{ vars.COLAB_ACCOUNT }}
        run: python -m benchmarks.automation.hosted bootstrap
      - name: Run fixed measurements through the shared Colab queue
        run: >-
          python3 -m benchmarks.automation colab
          --request output/official-request/request.json
          --output output/official-measurement
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: benchmark-results
          path: output/official-measurement
          if-no-files-found: error
          retention-days: 14
      - name: Export measurement receipts without live session credentials
        if: always()
        env:
          COLAB_AUTH_JSON: ${{ secrets.COLAB_AUTH_JSON }}
        run: python -m benchmarks.automation.hosted receipts --output output/pool-receipts
      - name: Preserve owned pool receipts for inspection and recovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: benchmark-pool-state
          path: output/pool-receipts
          if-no-files-found: warn
          retention-days: 14
      - name: Erase runner OAuth cache
        if: always()
        run: python -m benchmarks.automation.hosted erase

  ingest:
    needs: [prepare, measure]
    if: always() && github.repository == 'takumiecd/torchcst' && github.ref == 'refs/heads/main' && needs.prepare.result == 'success' && (needs.measure.result == 'success' || needs.measure.result == 'failure')
    runs-on: ubuntu-latest
    environment: benchmark-database
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install ingestion tooling
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'psycopg[binary]>=3.2,<4'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: benchmark-request
          path: output/official-request
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: benchmark-results
          path: output/official-measurement
      - name: Validate result bindings before receiving DB credentials
        env:
          PYTHONPATH: src
        run: >-
          python -m benchmarks.automation validate
          --request output/official-request/request.json
          --results output/official-measurement/results
      - name: Attach workflow provenance from GitHub metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: >-
          python -m benchmarks.automation.contributions provenance
          --repository "$REPOSITORY" --run-id "$RUN_ID"
          --output output/provenance.json
      - name: Append verified observations to Neon
        env:
          PYTHONPATH: src
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: >-
          python -m benchmarks.automation ingest
          --request output/official-request/request.json
          --results output/official-measurement/results
          --provenance output/provenance.json
