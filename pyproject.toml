[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "torchcst"
version = "0.0.1"
description = "Fixed-shape continuous operators for PyTorch"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "takumiecd" }]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["build", "pytest", "ruff"]
cuda = ["torch>=2.6", "triton>=3.2; sys_platform == 'linux'", "ninja"]
benchmark-db = ["psycopg[binary]>=3.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/torchcst"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
