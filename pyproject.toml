[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torchcst"
version = "0.0.1"
description = "Continuous Sparse Training in PyTorch — atomic measures, kernels, and policy-driven structural evolution"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "takumiecd" }]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/torchcst"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
